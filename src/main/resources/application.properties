spring.application.name=instaChatAuto
instagram.webhook.verify-token=${INSTAGRAM_WEBHOOK_VERIFY_TOKEN}
instagram.access-token=${INSTAGRAM_ACCESS_TOKEN}
INSTAGRAM_ACCOUNT_ID=${INSTAGRAM_ACCOUNT_ID}
server.port=${PORT:8080}


spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-20b
spring.ai.openai.chat.temperature=0.7   

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


qdrant.url=${QDRANT_URL}
qdrant.api-key=${QDRANT_API_KEY}
qdrant.collection=meowmart_docs
qdrant.embedding-model=sentence-transformers/all-minilm-l6-v2

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
